<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Personality Mixer{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-deep: #050716;
            --space-mid: #0c1233;
            --nebula-violet: #5b3fd6;
            --nebula-rose: #b8408f;
            --star: #fff4dc;
            --mint: #23d5ab;
            --sky: #23a6d5;
            --text: #f4f2ff;
            --muted: #aeacce;
            --line: rgba(190, 185, 255, 0.18);
            --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { background: var(--space-deep); }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: clamp(28px, 7vh, 72px) 20px 48px;
            font-family: var(--font);
            color: var(--text);
            background: linear-gradient(180deg, var(--space-deep) 0%, var(--space-mid) 55%, #150f36 100%);
            background-attachment: fixed;
        }

        /* ---------- Space backdrop ---------- */

        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .nebula {
            position: absolute;
            width: 70vmax;
            height: 70vmax;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.5;
            will-change: transform;
        }
        .nebula.violet {
            top: -25vmax; left: -20vmax;
            background: radial-gradient(circle, var(--nebula-violet) 0%, transparent 65%);
            animation: drift-a 70s ease-in-out infinite alternate;
        }
        .nebula.rose {
            bottom: -30vmax; right: -25vmax;
            background: radial-gradient(circle, var(--nebula-rose) 0%, transparent 62%);
            opacity: 0.34;
            animation: drift-b 90s ease-in-out infinite alternate;
        }

        @keyframes drift-a { to { transform: translate(9vmax, 6vmax) scale(1.08); } }
        @keyframes drift-b { to { transform: translate(-8vmax, -5vmax) scale(1.1); } }

        #stars {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* a planet's curved edge rising along the bottom of the screen */
        .planet {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 150vw;
            height: 150vw;
            transform: translate(-50%, 93%);
            border-radius: 50%;
            background: radial-gradient(circle at 50% 0%, #1a1550 0%, #0a0c26 45%, #050716 75%);
            box-shadow:
                0 -2px 0 rgba(160, 150, 255, 0.55),
                0 -14px 50px rgba(110, 90, 240, 0.4),
                0 -60px 140px rgba(91, 63, 214, 0.28);
        }

        /* ---------- Layout ---------- */

        main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
        }

        header { margin-bottom: 28px; }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2.4rem, 9vw, 3.6rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            font-variation-settings: "opsz" 96;
            text-shadow: 0 0 40px rgba(140, 120, 255, 0.45);
        }

        .lede {
            margin: 0;
            max-width: 46ch;
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--muted);
        }

        .panel {
            padding: clamp(20px, 5vw, 32px);
            border: 1px solid var(--line);
            border-radius: 20px;
            background: rgba(12, 16, 48, 0.62);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        }

        .error {
            margin: 0 0 20px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 130, 150, 0.5);
            border-radius: 12px;
            background: rgba(255, 90, 120, 0.12);
            color: #ffd3da;
            font-size: 0.95rem;
        }

        /* ---------- Buttons ---------- */

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            min-height: 46px;
        }
        .actions [hidden] { display: none; }
        .spacer { flex: 1; }

        .btn {
            font: inherit;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 22px;
            border-radius: 999px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
        }
        .btn:focus-visible { outline: 2px solid var(--star); outline-offset: 3px; }

        .btn.ghost {
            background: transparent;
            border-color: var(--line);
            color: var(--text);
        }
        .btn.ghost:hover { border-color: rgba(190, 185, 255, 0.5); }

        .btn.primary {
            background: var(--mint);
            color: #04211b;
        }
        .btn.primary:hover:not(:disabled) { background: var(--sky); }
        .btn.primary:active:not(:disabled) { transform: scale(0.98); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        a.btn { display: inline-block; text-decoration: none; text-align: center; }

        @media (prefers-reduced-motion: reduce) {
            .nebula { animation: none; }
            .btn { transition: none; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="backdrop" aria-hidden="true">
        <div class="nebula violet"></div>
        <div class="nebula rose"></div>
        <canvas id="stars"></canvas>
        <div class="planet"></div>
    </div>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
    /* ---------- Starfield ---------- */
    (function () {
        var canvas = document.getElementById('stars');
        var ctx = canvas.getContext('2d');
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var w, h, stars = [], shooters = [], nextShooter = 0;
        var tints = ['255,255,255', '255,244,220', '200,215,255', '255,210,235'];

        function build() {
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            var count = Math.round((w * h) / 5200);
            stars = [];
            for (var i = 0; i < count; i++) {
                var depth = Math.random();               // 0 = far, 1 = near
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: 0.3 + depth * 1.2,
                    base: 0.35 + depth * 0.55,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.004 + Math.random() * 0.02,
                    drift: 0.01 + depth * 0.05,
                    tint: tints[Math.floor(Math.random() * tints.length)]
                });
            }
        }

        function spawnShooter() {
            var startX = Math.random() * w * 0.8 + w * 0.1;
            shooters.push({
                x: startX,
                y: Math.random() * h * 0.4,
                vx: 7 + Math.random() * 4,
                vy: 3 + Math.random() * 2,
                life: 0,
                max: 45 + Math.random() * 20
            });
        }

        function draw(time) {
            ctx.clearRect(0, 0, w, h);

            for (var i = 0; i < stars.length; i++) {
                var s = stars[i];
                var twinkle = reduce ? 1 : 0.65 + 0.35 * Math.sin(s.phase);
                ctx.fillStyle = 'rgba(' + s.tint + ',' + (s.base * twinkle).toFixed(3) + ')';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
                if (!reduce) {
                    s.phase += s.speed;
                    s.x -= s.drift;
                    if (s.x < -2) s.x = w + 2;
                }
            }

            if (!reduce) {
                if (time > nextShooter) {
                    spawnShooter();
                    nextShooter = time + 7000 + Math.random() * 9000;
                }
                for (var j = shooters.length - 1; j >= 0; j--) {
                    var m = shooters[j];
                    var fade = 1 - m.life / m.max;
                    var grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 9, m.y - m.vy * 9);
                    grad.addColorStop(0, 'rgba(255,244,220,' + (0.9 * fade).toFixed(3) + ')');
                    grad.addColorStop(1, 'rgba(255,244,220,0)');
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(m.x - m.vx * 9, m.y - m.vy * 9);
                    ctx.stroke();
                    m.x += m.vx;
                    m.y += m.vy;
                    if (++m.life > m.max) shooters.splice(j, 1);
                }
                requestAnimationFrame(draw);
            }
        }

        var resizeTimer;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                build();
                if (reduce) draw(0);
            }, 150);
        });

        build();
        nextShooter = 3000;
        requestAnimationFrame(draw);
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
