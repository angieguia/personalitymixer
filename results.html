<!DOCTYPE html>
<html>
<head>
    <title>Personality Mixer - Results</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: url(https://i.ibb.co/87GbbFP/2799006.jpg) no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: 0% 50%;
            animation: gradient 3s linear infinite;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        a {
            color: #23d5ab;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #23a6d5;
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <h1>Your Personality Playlist!</h1>
    <p>Click the link below to listen:</p>
    <a href="{{ playlist_link }}" target="_blank">Your Playlist</a>
    <br><br>
    <a href="/index">Take the quiz again!</a>
</body>
</html>
